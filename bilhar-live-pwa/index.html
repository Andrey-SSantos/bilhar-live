<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Bilhar Live</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06100c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bilhar Live">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#06100c;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06100c}
  #inst{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:5;display:none;
    align-items:center;gap:10px;background:#0d2018;color:#f4e7c0;border:1px solid #c9a24a;border-radius:999px;padding:8px 8px 8px 16px;
    font:600 14px/1.2 system-ui,sans-serif;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #inst button{border:0;border-radius:999px;padding:9px 16px;font:700 14px system-ui,sans-serif;cursor:pointer;background:#c9a24a;color:#1a1305}
  #inst button.x{background:transparent;color:#f4e7c0;padding:6px 10px}
</style>
</head>
<body>
<iframe id="app" allow="fullscreen; autoplay; clipboard-write" allowfullscreen title="Bilhar Live"></iframe>
<div id="inst"><span id="instTxt">Instalar o Bilhar Live</span><button id="instGo">Instalar</button><button class="x" id="instX" aria-label="Fechar">✕</button></div>
<script>
/* ▼▼▼ COLE AQUI o link da sua implantação do Apps Script (termina em /exec) ▼▼▼ */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwBUV2iR7BYkodxyWWW73FLB2xYds3opH7HIhfrJkD-l77rvohBKU0oeWuyBQHijmTL/exec';
/* ▲▲▲ só isso precisa ser configurado ▲▲▲ */

(function () {
  // convite: abrir  .../?sala=ABCD  repassa o código para o jogo
  var q = new URLSearchParams(location.search), sala = (q.get('sala') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  document.getElementById('app').src = EXEC_URL + (sala ? (EXEC_URL.indexOf('?') < 0 ? '?' : '&') + 'sala=' + sala : '');

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  // botão de instalar (só aparece no navegador, nunca dentro do app já instalado)
  var standalone = matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
  var box = document.getElementById('inst'), go = document.getElementById('instGo'), dismissed = false, ev = null;
  try { dismissed = localStorage.getItem('instX') === '1'; } catch (e) {}
  function show() { if (!standalone && !dismissed) box.style.display = 'flex'; }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); ev = e; show(); });
  go.onclick = function () {
    if (ev) { ev.prompt(); ev.userChoice.finally(function () { ev = null; box.style.display = 'none'; }); }
    else alert('No iPhone: toque em Compartilhar e depois em "Adicionar à Tela de Início".');
  };
  document.getElementById('instX').onclick = function () { box.style.display = 'none'; try { localStorage.setItem('instX', '1'); } catch (e) {} };
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) {
    document.getElementById('instTxt').textContent = 'No iPhone: Compartilhar → Adicionar à Tela de Início';
    go.style.display = 'none'; show();
  }
  window.addEventListener('appinstalled', function () { box.style.display = 'none'; });
})();
</script>
</body>
</html>
